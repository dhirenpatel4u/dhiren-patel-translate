<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dhiren Translate</title>

    <!-- Microsoft Office JavaScript API -->
    <script
        src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #202124;
            background: #ffffff;
        }

        h2 {
            margin: 0 0 5px;
            font-size: 21px;
        }

        .subtitle {
            color: #5f6368;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 12px;
            font-weight: 600;

            margin: 14px 0 6px;
        }

        select,
        textarea,
        button {
            width: 100%;
        }

        select,
        textarea {
            border: 1px solid #dadce0;

            border-radius: 7px;

            padding: 9px;

            font-family: inherit;

            font-size: 13px;

            outline: none;
        }

        select:focus,
        textarea:focus {
            border-color: #1a73e8;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 10px;

            border: 0;

            border-radius: 7px;

            background: #1a73e8;

            color: white;

            padding: 11px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .secondary {
            background: #5f6368;
        }

        .secondary:hover {
            background: #3c4043;
        }

        .result {
            margin-top: 18px;

            padding: 13px;

            min-height: 100px;

            background: #f8f9fa;

            border: 1px solid #e8eaed;

            border-radius: 7px;

            font-size: 14px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .status {
            margin-top: 10px;

            color: #5f6368;

            font-size: 12px;
        }

        .error {
            color: #d93025;
        }

        .success {
            color: #188038;
        }

        .excel-info {
            margin-top: 10px;

            padding: 8px;

            background: #f1f3f4;

            border-radius: 6px;

            font-size: 11px;

            color: #5f6368;
        }

    </style>

</head>


<body>

    <h2>Dhiren Translate</h2>

    <div class="subtitle">
        Translate text using your Dhiren Translate API.
    </div>


    <!-- SOURCE LANGUAGE -->

    <label for="sourceLanguage">
        From
    </label>

    <select id="sourceLanguage">

        <option value="auto">
            Detect language
        </option>

        <option value="en">
            English
        </option>

        <option value="hi">
            Hindi
        </option>

        <option value="gu">
            Gujarati
        </option>

        <option value="mr">
            Marathi
        </option>

        <option value="bn">
            Bengali
        </option>

        <option value="ta">
            Tamil
        </option>

        <option value="te">
            Telugu
        </option>

        <option value="de">
            German
        </option>

        <option value="fr">
            French
        </option>

        <option value="es">
            Spanish
        </option>

    </select>


    <!-- TARGET LANGUAGE -->

    <label for="targetLanguage">
        To
    </label>

    <select id="targetLanguage">

        <option value="en">
            English
        </option>

        <option value="hi">
            Hindi
        </option>

        <option value="gu">
            Gujarati
        </option>

        <option value="mr">
            Marathi
        </option>

        <option value="bn">
            Bengali
        </option>

        <option value="ta">
            Tamil
        </option>

        <option value="te">
            Telugu
        </option>

        <option value="de">
            German
        </option>

        <option value="fr">
            French
        </option>

        <option value="es">
            Spanish
        </option>

    </select>


    <!-- SOURCE TEXT -->

    <label for="sourceText">
        Text
    </label>

    <textarea
        id="sourceText"
        placeholder="Enter text to translate..."
    ></textarea>


    <!-- GET EXCEL SELECTION -->

    <button
        id="getSelectionButton"
        class="secondary"
    >
        Get Selected Excel Cells
    </button>


    <div
        id="excelInfo"
        class="excel-info"
    >
        No Excel range selected.
    </div>


    <!-- TRANSLATE -->

    <button
        id="translateButton"
    >
        Translate
    </button>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    >
        Translation will appear here.
    </div>


    <!-- WRITE BACK TO EXCEL -->

    <button
        id="writeExcelButton"
        class="secondary"
    >
        Write Translation to Excel
    </button>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- YOUR JAVASCRIPT -->

    <script src="./taskpane.js"></script>

</body>

</html>
